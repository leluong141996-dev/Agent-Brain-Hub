name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Memory benchmark (fails if a quality metric gets worse)
        run: |
          set -o pipefail
          npm run bench --silent -- --gate bench/results/0.5.0.json | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4317/healthz && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: End-to-end
        run: node scripts/e2e.mjs --url http://localhost:4317 --lang en
      - if: always()
        run: docker compose down -v
